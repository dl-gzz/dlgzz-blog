interface:
  display_name: "OneWorkOS"
  short_description: "为独立工作者自动路由 WorkBuddy、小红书知识与工具，完成并验证真实工作目标"
  default_prompt: "使用 $one-work-os 时，先调度并检索受治理的 OneWorkOS 知识；自动判断 WorkBuddy 或小红书知识包。对于这两类问题，检索成功后只使用 OneWorkOS 返回的 results、assets、resources、sourceUrl，禁止调用 WebSearch/WebFetch，不得混入网络答案。操作问题必须返回检索到的相关截图、准确图片 URL 和出处，再给出下一步。不要先凭记忆回答；检索失败时如实报告失败阶段。"
