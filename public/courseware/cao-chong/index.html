</section></div></main><script>/* Reference-style teaching simulation. Numerical masses are illustrative. */
const LESSON={weights:[200,400,300,500,600,700,200,300,400,200,300,400],target:3600,waterY:283,sink:30,maxBatch:3};
// Coordinates in the common 900 × 560 scene, independent of the viewport.
const SCENE={
  shoreY:343, shoreFraction:.60,
  speakerHead:{x:110,y:361},
  resultAnchor:{x:533,y:67},
  formulaAnchor:{x:400,y:29},
  line:{left:220,right:600},
  boatDrop:{left:155,right:645,top:141,bottom:303},
  shoreDrop:{left:26,right:874,top:348,bottom:550},
  scaleDrop:{left:614,right:844,top:430,bottom:501},
};
function lessonDropTarget(kind, stage, point) {
  const inside = ({left,right,top,bottom}) => point.x>=left && point.x<=right && point.y>=top && point.y<=bottom;
  if ((kind==='elephant' && stage===0 || kind==='rock' && (stage===3 || stage===4)) && inside(SCENE.boatDrop)) return 'boat';
  if ((kind==='elephant' && stage===2 || kind==='rock' && stage===3) && inside(SCENE.shoreDrop)) return 'shore';
  if (kind==='rock' && stage===4 && inside(SCENE.scaleDrop)) return 'scale';
  return null;
}
class LessonModel {
 constructor(){this.reset()}
 reset(){this.stage=0;this.locations=LESSON.weights.map(()=>'shore');this.batch=[];this.records=[];this.mark=null;this.history=[];this.message='';}
 snapshot(){return JSON.parse(JSON.stringify({stage:this.stage,locations:this.locations,batch:this.batch,records:this.records,mark:this.mark,message:this.message}))}
 save(){this.history.push(this.snapshot())}
 undo(){if(!this.history.length)return false;Object.assign(this,this.history.pop());return true}
 get load(){return LESSON.weights.reduce((n,w,i)=>n+(this.locations[i]==='boat'?w:0),0)}
 // The final replay puts the elephant back aboard without changing the recorded batches.
 get elephantAboard(){return this.stage===1||this.stage===2||this.stage===6}
 get sink(){return this.elephantAboard?LESSON.sink:Math.min(42,this.load/LESSON.target*LESSON.sink)}
 get batchWeight(){return this.batch.reduce((n,i)=>n+LESSON.weights[i],0)}
