name: one-worker-os checks

on:
  push:
    branches: [main, codex/**]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit --pretty false
      - run: node scripts/test-deploy-version.mjs
      - run: pnpm run one-worker-os:plugin:validate
      - run: pnpm run one-worker-os:universal:validate
      - run: pnpm run one-worker-os:connector:validate
      - run: pnpm run test:onework:mcp
      - name: Test OAuth client isolation without production access
        run: |
          npm install --prefix "$RUNNER_TEMP/oauth-test" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          MEMBERSHIP_TEST_DEPS="$RUNNER_TEMP/oauth-test" node scripts/test-onework-oauth-isolated.mjs
      - run: pnpm run test:onework:import-security
      - run: pnpm run test:onework:pack-authorization
      - run: pnpm run build
        env:
          # Route modules validate the database URL while Next.js collects build
          # metadata. No database connection is made during this CI build.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
