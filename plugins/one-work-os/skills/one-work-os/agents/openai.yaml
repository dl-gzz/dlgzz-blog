  default_prompt: "使用 $one-work-os 先调用 OneWorkerOS MCP 检索实时知识，保留短追问的最近明确主题，并用返回的资产与出处回答。"
dependencies:
  tools:
    - type: "mcp"
      value: "onework-os"
      description: "OneWorkerOS live MCP service"
      transport: "streamable_http"
